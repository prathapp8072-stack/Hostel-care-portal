<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - Hostel Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 450px;">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3 text-primary text-center">Student Signup</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 fw-bold">Create Account</button>
            </form>
            <p class="mt-3 text-center small">Already have an account? <a href="/login/">Login here</a></p>
        </div>
    </div>
</body>
</html>
